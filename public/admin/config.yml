          - name: nguon
            label: nguon
            required: false
            widget: list
            fields:
              - name: ref
                label: ref
                required: true
                widget: relation
                collection: nguon
                value_field: id
                search_fields:
                  - id
                  - ten
                display_fields:
                  - ten
              - name: trang
