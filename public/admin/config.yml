        required: false
        widget: select
        multiple: true
        options:
          - label: Thời tiết
            value: thoi_tiet
          - label: Nông nghiệp
            value: nong_nghiep
          - label: Ứng xử
            value: ung_xu
          - label: Gia đình
            value: gia_dinh
          - label: Xã hội
            value: xa_hoi
          - label: Sức khỏe
            value: suc_khoe
