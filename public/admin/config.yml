        hint: Với tục ngữ.
        required: false
        widget: string
      - name: nghia_bong
        label: Nghĩa bóng
        hint: Với tục ngữ.
        required: false
        widget: string
      - name: chu_giai
        label: Chú giải từ khó
        hint: Từ khó với học sinh lớp 7. Chạm vào từ trên trang sẽ hiện nghĩa.
        required: false
        widget: list
        fields:
          - name: di_ban
            label: Trong dị bản
            hint: Mã dị bản chứa từ, thường `v1`.
            required: true
            widget: string
          - name: dong
            label: Dòng số
            hint: Chỉ điền khi máy báo cụm từ xuất hiện ở nhiều dòng.
            required: false
            widget: number
            value_type: int
            min: 1
          - name: cum_tu
            label: Cụm từ
