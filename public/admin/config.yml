      - name: ban_dai_dien
        label: ban_dai_dien
        required: true
        widget: string
      - name: ly_do_chon
        label: ly_do_chon
        required: false
        widget: string
      - name: di_ban
        label: di_ban
        required: true
        widget: list
        fields:
          - name: id
            label: id
            required: true
            widget: string
            pattern:
              - ^v\d+$
              - Sai định dạng
          - name: loi
            label: loi
            required: true
            widget: text
          - name: vung
            label: vung
