      - name: id
        label: id
        required: true
        widget: string
      - name: slug
        label: slug
        required: true
        widget: string
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - Sai định dạng
      - name: the_loai
        label: the_loai
        required: true
        widget: select
        options:
          - label: Ca dao
            value: ca_dao
          - label: Tục ngữ
            value: tuc_ngu
          - label: Thành ngữ
            value: thanh_ngu
          - label: Đồng dao
