# TỆP SINH TỰ ĐỘNG bởi scripts/sinh-tu-schema.mjs — không sửa tay.
# Sửa scripts/lib/schema.mjs, scripts/lib/giao-dien-cms.mjs hoặc taxonomy/tu-vung-kiem-soat.yaml rồi chạy `npm run sinh:schema`.
backend:
  name: github
  repo: truonganhquyen/ca-dao
  branch: main
  base_url: https://sveltia-cms-auth.truonganhquyen.workers.dev
  commit_messages:
    create: "Nội dung: thêm {{collection}} {{slug}}"
    update: "Nội dung: sửa {{collection}} {{slug}}"
    delete: "Nội dung: xóa {{collection}} {{slug}}"
    uploadMedia: "Nội dung: tải tệp {{path}}"
    deleteMedia: "Nội dung: xóa tệp {{path}}"
site_url: https://ca-dao.truonganhquyen.workers.dev
display_url: https://ca-dao.truonganhquyen.workers.dev
media_folder: public/tep
collections:
  - name: them-nhanh
    label: Thêm nhanh (bài nháp)
    label_singular: bài nháp
    description: 'Lưu nhanh một bài vừa nghe hoặc vừa đọc: tiêu đề, lời, vùng, nguồn. Bài lưu ở trạng thái Nháp, chưa lên trang; làm giàu sau trong bộ "Tác phẩm".'
    folder: content/tac-pham
    extension: yaml
    format: yaml
    create: true
    identifier_field: id
    slug: "{{fields.id}}"
    editor:
      preview: false
    filter:
      field: id
      pattern: ^$
    fields:
      - name: tieu_de
        label: Tiêu đề
        hint: Thường là dòng đầu của bản tham chiếu.
        required: true
        widget: string
      - name: the_loai
        label: Thể loại
        required: true
        widget: select
        options:
          - label: Ca dao
            value: ca_dao
          - label: Tục ngữ
            value: tuc_ngu
          - label: Thành ngữ
            value: thanh_ngu
          - label: Đồng dao
            value: dong_dao
          - label: Vè
            value: ve
          - label: Câu đố
            value: cau_do
        default: ca_dao
      - name: di_ban
        label: Lời (các dị bản)
        hint: Mỗi cách nói là một dị bản. Bản đầu tiên thường là v1.
        required: true
        widget: list
        fields:
          - name: id
            widget: hidden
            default: v1
          - name: loi
            label: Lời
            hint: Mỗi dòng thơ một dòng. Gõ hoặc dán **đúng như nguồn**; không sửa chữ khi chưa có nguồn khác. Nghi sai chữ thì ghi vào "Ghi chú".
            required: true
            widget: text
          - name: vung
            label: Vùng
            hint: Vùng văn hóa theo nguồn. Chưa biết thì chọn "Chưa rõ vùng".
            required: true
            widget: select
            multiple: true
            options:
              - label: Bắc Bộ
                value: bac_bo
              - label: Bắc Trung Bộ
                value: bac_trung_bo
              - label: Trung Trung Bộ
                value: trung_trung_bo
              - label: Nam Trung Bộ
                value: nam_trung_bo
              - label: Tây Nguyên
                value: tay_nguyen
              - label: Nam Bộ
                value: nam_bo
              - label: Phổ biến toàn quốc
                value: toan_quoc
              - label: Chưa rõ vùng
                value: khong_ro
            min: 1
            default: &a1
              - khong_ro
          - name: nguon
            label: Lời lấy từ đâu
            hint: Bắt buộc trước khi công khai (ít nhất một nguồn, hoặc mã đóng góp).
            required: false
            widget: list
            fields:
              - name: ref
                label: Nguồn
                hint: Chọn từ danh sách Nguồn. Chưa có thì tạo trong bộ "Nguồn" trước.
                required: true
                widget: relation
                collection: nguon
                value_field: id
                search_fields:
                  - id
                  - ten
                display_fields:
                  - ten
                default: src-ca-dao-me
              - name: url
                label: Địa chỉ trang web
                hint: Địa chỉ của **đúng trang** đã lấy (không phải trang chủ). Bắt đầu bằng `https://`.
                required: false
                widget: string
                pattern:
                  - ^https?:\/\/
                  - Sai định dạng — xem gợi ý dưới ô
              - name: ngay_truy_cap
                label: Ngày truy cập
                hint: Ngày bạn mở trang đó.
                required: false
                widget: datetime
                format: YYYY-MM-DD
                time_format: false
                default: "{{now}}"
              - name: trang
                label: Số trang
                hint: "Với sách, tạp chí, luận văn, bản quét. Ví dụ: `123` hoặc `45–46`."
                required: false
                widget: string
            default: []
          - name: nguoi_ke
            label: Người kể
            hint: Không ghi tên thật.
            required: false
            widget: object
            fields:
              - name: the_he
                label: Thế hệ
                hint: "Ví dụ: sinh khoảng 1940."
                required: false
                widget: string
              - name: quan_he
                label: Quan hệ
                hint: "Ví dụ: bà nội của người đóng góp."
                required: false
                widget: string
            collapsed: true
          - name: ghi_chu
            label: Ghi chú về lời
            hint: "Ví dụ: chỗ nghi sai chữ, khác với nguồn khác."
            required: false
            widget: string
        min: 1
        max: 1
        default:
          - id: v1
      - name: id
        label: Mã bài
        hint: "Tiền tố theo thể loại + 4 chữ số chưa dùng: `cd-` ca dao, `tn-` tục ngữ, `tng-` thành ngữ, `dd-` đồng dao, `ve-` vè, `cdo-` câu đố. Ví dụ: `cd-0004`."
        required: true
        widget: string
      - name: slug
        label: Đường dẫn
        hint: "Chữ thường không dấu, nối bằng gạch ngang. Ví dụ: `cong-cha-nghia-me`."
        required: true
        widget: string
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - Sai định dạng — xem gợi ý dưới ô
      - name: bien_soan
        label: Biên soạn
        required: true
        widget: object
        fields:
          - name: nguoi
            label: Người biên soạn
            required: true
            widget: relation
            collection: nguoi-dong-gop
            value_field: id
            search_fields:
              - id
              - ten_hien_thi
            display_fields:
              - ten_hien_thi
            default: ctb-0001
          - name: ngay_tao
            label: Ngày tạo
            required: true
            widget: datetime
            format: YYYY-MM-DD
            time_format: false
            default: "{{now}}"
      - name: ban_dai_dien
        widget: hidden
        default: v1
      - name: trang_thai
        widget: hidden
        default: nhap
  - name: tac-pham
    label: Tác phẩm
    label_singular: tác phẩm
    description: Ca dao, tục ngữ, thành ngữ… Mỗi bài một tệp. Lời chỉ lấy từ nguồn có ghi rõ, không sửa khi chưa có nguồn khác.
    folder: content/tac-pham
    extension: yaml
    format: yaml
    create: true
    identifier_field: id
    slug: "{{fields.id}}"
    editor:
      preview: false
    summary: "{{fields.tieu_de}} · {{fields.id}}"
    fields:
      - name: tieu_de
        label: Tiêu đề
        hint: Thường là dòng đầu của bản tham chiếu.
        required: true
        widget: string
      - name: the_loai
        label: Thể loại
        required: true
        widget: select
        options:
          - label: Ca dao
            value: ca_dao
          - label: Tục ngữ
            value: tuc_ngu
          - label: Thành ngữ
            value: thanh_ngu
          - label: Đồng dao
            value: dong_dao
          - label: Vè
            value: ve
          - label: Câu đố
            value: cau_do
        default: ca_dao
      - name: the_tho
        label: Thể thơ
        hint: Với ca dao. Lục bát được thụt lề câu sáu chữ.
        required: false
        widget: select
        options:
          - label: Lục bát
            value: luc_bat
          - label: Lục bát biến thể
            value: luc_bat_bien_the
          - label: Song thất lục bát
            value: song_that_luc_bat
          - label: Thể bốn chữ
            value: van_4
          - label: Thể năm chữ
            value: van_5
          - label: Hợp thể
            value: hop_the
      - name: di_ban
        label: Lời (các dị bản)
        hint: Mỗi cách nói là một dị bản. Bản đầu tiên thường là v1.
        required: true
