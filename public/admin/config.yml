            required: true
            widget: text
          - name: vung
            label: Vùng
            hint: Vùng văn hóa theo nguồn. Chưa biết thì chọn "Chưa rõ vùng".
            required: true
            widget: select
            multiple: true
            options:
              - label: Bắc Bộ
                value: bac_bo
              - label: Bắc Trung Bộ
                value: bac_trung_bo
              - label: Trung Trung Bộ
                value: trung_trung_bo
              - label: Nam Trung Bộ
                value: nam_trung_bo
              - label: Tây Nguyên
                value: tay_nguyen
              - label: Nam Bộ
                value: nam_bo
              - label: Phổ biến toàn quốc
                value: toan_quoc
              - label: Chưa rõ vùng
                value: khong_ro
            min: 1
            default: *a1
          - name: dia_danh
            label: Địa danh
            hint: Đúng như nguồn hoặc người kể gọi, kể cả tên cũ.
            required: false
            widget: string
          - name: nguon
            label: Lời lấy từ đâu
            hint: Bắt buộc trước khi công khai (ít nhất một nguồn, hoặc mã đóng góp).
            required: false
            widget: list
            fields:
              - name: ref
                label: Nguồn
                hint: Chọn từ danh sách Nguồn. Chưa có thì tạo trong bộ "Nguồn" trước.
                required: true
                widget: relation
                collection: nguon
                value_field: id
                search_fields:
                  - id
                  - ten
                display_fields:
                  - ten
                default: src-ca-dao-me
              - name: trang
                label: Số trang
                hint: "Với sách, tạp chí, luận văn, bản quét. Ví dụ: `123` hoặc `45–46`."
                required: false
                widget: string
              - name: url
                label: Địa chỉ trang web
                hint: Địa chỉ của **đúng trang** đã lấy (không phải trang chủ). Bắt đầu bằng `https://`.
