                required: false
                widget: string
                pattern:
                  - ^https?:\/\/
                  - Sai định dạng — xem gợi ý dưới ô
              - name: cach_dung
                label: Cách dùng nguồn
                hint: '"Tham khảo" = đã viết lại bằng lời của mình. "Trích nguyên văn" chỉ khi nguồn cho phép bằng văn bản, hoặc định nghĩa ≤ 15 từ.'
