    tu: "2027-03-01"
    den: "2027-03-08"
    dua_len_dau: [sit-ngay-phu-nu, sit-biet-on-cha-me]
  - ten: "Ngày Phụ nữ Việt Nam"
    tu: "2026-10-13"
    den: "2026-10-20"
    dua_len_dau: [sit-ngay-phu-nu, sit-biet-on-cha-me]
  - ten: "Ngày Nhà giáo Việt Nam"
    tu: "2026-11-10"
    den: "2026-11-20"
