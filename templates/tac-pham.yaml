# MẪU TÁC PHẨM (schema 2.0) — sao chép thành content/tac-pham/<id>.yaml (vd: cd-0142.yaml)
# Đặc tả từng trường: docs/10-dac-ta-du-lieu.md mục 4.1
# Quy ước: thiếu thông tin -> ghi CAN_BO_SUNG (trường đó sẽ ẩn trên trang).
#          Văn bản do AI soạn nháp -> mở đầu bằng NHAP_AI; chỉ lên trang khi nhap_ai_da_duyet: true.
# Nhãn bằng chứng KHÔNG nhập tay: máy tự tính từ nguồn (D-041).

id:                    # cd-#### | tn-#### | tng-#### | dd-#### | ve-#### | cdo-####  (bất biến, không tái sử dụng)
slug:                  # không dấu, chữ thường, nối gạch ngang, ≤ 60 ký tự; đổi slug thì thêm dòng vào redirects.yaml
the_loai:              # ca_dao | tuc_ngu | thanh_ngu | dong_dao | ve | cau_do
the_tho:               # chỉ ca dao: luc_bat | luc_bat_bien_the | song_that_luc_bat | van_4 | van_5 | hop_the
tieu_de: ""            # thường là dòng đầu của bản tham chiếu
ban_dai_dien: v1       # id dị bản dùng làm "Bản tham chiếu"
ly_do_chon: ""         # một câu: vì sao chọn bản này (vd: "Bản phổ biến nhất trong các nguồn đã thấy.")

di_ban:
  - id: v1
    loi: |
      CAN_BO_SUNG
    vung: [khong_ro]
    dia_danh: ""       # đúng như người kể / sách gọi, kể cả tên cũ
    nguon:             # bài công khai cần ít nhất một nguồn gốc (R21)
      # Sách / tạp chí / luận văn / bản quét:
      - { ref: src-CAN_BO_SUNG, trang: "CAN_BO_SUNG" }
      # Trang web (R22) — url của đúng trang đã lấy, ngày truy cập, bản lưu Wayback:
      # - { ref: src-ca-dao-me, url: "https://cadao.me/...", ngay_truy_cap: "YYYY-MM-DD", ban_luu_tru: "https://web.archive.org/..." }
    ghi_chu: ""

chu_giai: []
#  - { di_ban: v1, cum_tu: "Thái Sơn", muc_tu: lx-thai-son }            # thường chỉ cần thế này
#  - { di_ban: v1, dong: 3, cum_tu: "cò", muc_tu: lx-... }              # khi cụm từ có ở nhiều dòng
#  - { di_ban: v1, dong: 3, cum_tu: "cò", lan: 2, muc_tu: lx-... }      # khi cụm từ lặp trong cùng dòng
#  Gõ cụm từ đúng như trong lời. Không cần đếm âm tiết: máy tự tìm vị trí và báo nếu mơ hồ.

nghia_ngan: ""         # ≤ 40 từ, nên ≤ 25 (khối "Hiểu trong 10 giây", kết quả tìm, mô tả SEO)
dien_giai:
  - goc_nhin: "Nghĩa phổ thông"
    noi_dung: ""
    nguon: []          # dựa vào ý của nguồn nào thì ghi; viết lại bằng lời của dự án (cach_dung: tham_khao)

# chỉ tục ngữ:
# nghia_den: ""
# nghia_bong: ""
# linh_vuc: []
# goc_kiem_chung: { ket_luan: chua_ro, noi_dung: "", nguon: [] }

am_luat: { nhip: "", van: [], ghi_chu: "" }
dien_xuong: { hinh_thuc: [khong_ro], nguoi_the_hien: "", boi_canh: "" }

mo_ta_tinh_huong: ["", ""]   # nên ≥ 2 câu đời thường, ngôi thứ hai ("Khi bạn…")
cam_xuc: []
chu_de: []
mo_tip: []
lien_quan: []
sgk: []
#  - { bo_sach: ket_noi_tri_thuc, lop: 6, bai: "" }

canh_bao_noi_dung: ""        # bài phản ánh định kiến xưa: giải thích bối cảnh (không gắn vào tình huống, R11)
xac_thuc_dan_gian: binh_thuong
can_cu_xac_thuc_dan_gian: ""
tranh_luan: false
ghi_chu_tranh_luan: ""

nhap_ai_da_duyet: false      # chỉ người biên soạn đặt true, sau khi đã đọc và đồng ý mọi chuỗi NHAP_AI (D-042)
trang_thai: nhap             # nhap | cong_khai | an
bien_soan: { nguoi: ctb-0001, ngay_tao: "YYYY-MM-DD" }
