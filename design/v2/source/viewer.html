<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bộ thiết kế Phongdao V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5e2dc;color:#22201c;font:14px/1.5 system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button{border:1px solid #605d57;background:transparent;color:inherit;border-radius:5px;padding:9px 12px;min-height:42px}button:hover{background:#44413c}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #bca8f4;outline-offset:2px}.studio-bar{background:#231c38;color:#f8f3e8;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:relative;z-index:4}.studio-brand{font-family:Georgia,serif;font-size:20px;margin-right:12px}.studio-brand span{font:12px system-ui,sans-serif;color:#c2bcb1;margin-left:8px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.studio-bar select{background:#33312c;color:#f8f3e8;border:1px solid #605d57;min-height:42px;border-radius:4px;padding:6px 10px;max-width:270px}.studio-bar label{font-size:12px;color:#c9c2b6}.studio-sub{background:#f8f5ee;border-bottom:1px solid #cec6b8;padding:9px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:12px;color:#5f594f}.studio-sub code{font-size:12px}.viewport-area{overflow:auto;padding:22px;min-height:80vh}.frames{display:flex;align-items:flex-start;justify-content:center;gap:24px;min-width:min-content}.frame-wrap{flex-shrink:0}.frame-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#575149;font-size:12px}.frame{display:block;width:100%;height:1000px;border:1px solid #c3baab;background:#fbf8f1;border-radius:5px;box-shadow:0 4px 22px #3128170e}.studio-index{position:fixed;inset:0;z-index:8;background:#0006;display:none}.studio-index.open{display:block}.index-content{max-width:470px;background:#fbf8f1;color:#22201c;height:100%;overflow:auto;padding:26px}.index-top{display:flex;align-items:center;justify-content:space-between}.index-top button{border-color:#c1b9ac}.index-top button:hover{background:#eee7dc}.index-content input{width:100%;border:1px solid #c8c0b2;padding:12px;background:white;margin:12px 0 20px}.index-content h3{font-size:12px;letter-spacing:.08em;color:#5e3aae;text-transform:uppercase;margin-top:24px}.screen-link{width:100%;text-align:left;color:#22201c;border:0;display:flex;gap:14px;align-items:center;padding:11px 8px;border-bottom:1px solid #e2dace;border-radius:0;font-size:14px}.screen-link:hover{background:#efe7da}.screen-link span{color:#777065;font-size:12px;width:30px;flex-shrink:0}.screen-link.selected{color:#5e3aae;font-weight:600}.studio-help{margin-left:auto}.choice-note{padding:10px 20px;color:#5c4c40;font-size:12px;background:#eee5d5;display:none}.studio-error{padding:30px;max-width:600px;margin:auto;background:#fbf8f1}.pill{padding:3px 8px;border:1px solid #bfb4a3;border-radius:20px;color:#65594b}.mobile-only{display:none}@media(max-width:767px){.studio-bar{padding:10px 12px;gap:8px;position:relative}.studio-brand{width:100%}.studio-bar select{max-width:180px}.studio-help{margin-left:0}.studio-sub{padding:9px 12px;flex-wrap:wrap}.viewport-area{padding:12px 0}.frames{justify-content:flex-start;padding:0 8px}.frame-label{padding-inline:6px}.studio-brand span{font-size:12px}.hide-small{display:none}}@media print{.studio-bar,.studio-sub,.choice-note,.studio-index{display:none}.viewport-area{padding:0}.frame{border:0;height:auto}}
</style></head><body><header class="studio-bar"><div class="studio-brand">Phongdao <span>V2 / Duyệt UX/UI · tím – lục</span></div><div class="controls"><button id="open-index">☰ Chỉ mục</button><label for="screen-select" class="hide-small">Màn</label><select id="screen-select" aria-label="Chọn màn hình"></select><select id="state-select" aria-label="Trạng thái màn hình"></select></div><div class="controls"><select id="width" aria-label="Khung nhìn"><option value="auto">Vừa cửa sổ</option><option value="390">Mobile · 390</option><option value="1440">Desktop · 1440</option><option value="320">Reflow · 320</option><option value="360">Mobile · 360</option><option value="768">Tablet · 768</option><option value="1024">Tablet · 1024</option></select><select id="theme" aria-label="Sáng hoặc tối"><option value="light">Sáng</option><option value="dark">Tối</option></select><button id="compare" aria-pressed="false">So sáng / tối</button><button id="full-page" aria-pressed="false">Toàn trang</button></div><button id="help" class="studio-help">Cách duyệt</button></header><div class="studio-sub"><span id="screen-meta"></span><span class="pill">Trang mẫu giao diện — dữ liệu thử · không nối WordPress</span></div><div class="choice-note" id="choice-note"></div><main class="viewport-area"><div class="frames" id="frames"></div></main><aside id="index" class="studio-index" role="dialog" aria-modal="true" aria-label="Chỉ mục màn hình"><div class="index-content"><div class="index-top"><h2>Đi qua Phongdao V2</h2><button id="close-index">Đóng</button></div><p>Tám màn đại diện được đánh dấu ★. Chọn từng trạng thái để duyệt cả thiếu dữ liệu và lỗi.</p><label for="index-query">Tìm màn hình</label><input id="index-query" type="search" placeholder="Tên hoặc mã màn hình"><div id="index-list"></div></div></aside><script>
const REG=/*REGISTRY*/,LABELS=/*LABELS*/,BODIES=/*BODIES*/,CSS=/*CSS*/,RUNTIME=/*RUNTIME*/,FIXTURES=/*FIXTURES*/;
const $=s=>document.querySelector(s),EARLY=['R01','R05','R06','R11','R12','R08','A01','A02'];let selected='R01',state='full',query='',compare=false,full=false,lastFocus;let frames=[],navHistory=[],positions={};
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
for(const group of [...new Set(REG.map(p=>p.group))]){let g=document.createElement('optgroup');g.label=group;REG.filter(p=>p.group===group).forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=(EARLY.includes(p.id)?'★ ':'')+p.id+' · '+p.title;g.append(o)});$('#screen-select').append(g)}
function renderIndex(){const q=$('#index-query').value.toLowerCase();$('#index-list').innerHTML=[...new Set(REG.map(x=>x.group))].map(g=>'<h3>'+g+(g==='Đợt 5'?' — chưa bật':'')+'</h3>'+REG.filter(p=>p.group===g&&(p.id+' '+p.title).toLowerCase().includes(q)).map(p=>'<button class="screen-link '+(p.id===selected?'selected':'')+'" data-id="'+p.id+'"><span>'+p.id+'</span>'+(EARLY.includes(p.id)?'★ ':'')+p.title+'</button>').join('')).join('');document.querySelectorAll('.screen-link').forEach(b=>b.onclick=()=>{navigate(b.dataset.id);closeIndex()})}
function doc(p,s,theme){let actual=p.id==='D02'&&s!=='decisions'?{...REG.find(x=>x.id===({home:'R01',poem:'R05',proverb:'R06'}[s]||'R01'))}:p;let actualState=p.id==='D02'&&s!=='decisions'?actual.states[0]:s;const config={id:actual.id,state:actualState,query,fixtures:FIXTURES};return '<!doctype html><html lang="vi" data-theme="'+theme+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(actual.title)+'</title><style>'+CSS+'</style></head><body>'+BODIES[actual.id+'|'+actualState]+'<script>window.PROTO='+JSON.stringify(config).replaceAll('</','<\\/')+';<\/script><script>'+RUNTIME.replaceAll('<'+'/script','<\\/script')+'<\/script><script>new ResizeObserver(()=>parent.postMessage({phongdao:true,type:"height",height:document.documentElement.scrollHeight},"*")).observe(document.body)<\/script></bo'+'dy></html>'}
function render(){const p=REG.find(x=>x.id===selected);if(!p)return;$('#screen-select').value=selected;$('#state-select').innerHTML=p.states.map(s=>'<option value="'+s+'" '+(s===state?'selected':'')+'>'+esc(LABELS[s]||s)+'</option>').join('');$('#screen-meta').innerHTML='<strong>'+p.id+' · '+esc(p.title)+'</strong> <span class="hide-small"> / '+esc(p.route)+'</span>';let theme=$('#theme').value;const compareNow=compare||(selected==='D02'&&state!=='decisions');const note=$('#choice-note');note.style.display=compareNow?'block':'none';note.textContent=compareNow?'Sáng và tối cùng bố cục, cùng dữ liệu — bảng tím – lục (D-092).':'';const w=$('#width').value;let actualWidth=w==='auto'?Math.max(280,document.documentElement.clientWidth-44):+w;if(compareNow&&w==='auto')actualWidth=Math.max(320,Math.floor((document.documentElement.clientWidth-72)/2));$('#frames').innerHTML='';frames=[];(compareNow?['light','dark']:[theme]).forEach(pal=>{const wrap=document.createElement('div');wrap.className='frame-wrap';wrap.style.width=actualWidth+'px';wrap.innerHTML='<div class="frame-label"><span>'+(pal==='dark'?'Tối':'Sáng')+'</span><span>'+actualWidth+' px</span></div>';const f=document.createElement('iframe');f.className='frame';f.title=p.title+' — '+(pal==='dark'?'tối':'sáng');f.style.height=(actualWidth<=430?844:1000)+'px';f.srcdoc=doc(p,state,pal);wrap.append(f);$('#frames').append(wrap);frames.push(f)});renderIndex();try{history.replaceState(null,'','#'+selected+'-'+state)}catch(e){}}
function navigate(id,q=''){if(!REG.some(x=>x.id===id)){alert('Màn này thuộc phần đang được hoàn thiện sau tám màn xem sớm.');return}if(id!==selected||q!==query){positions[selected+'|'+state]=frames[0]?.contentDocument?.documentElement?.scrollTop||0;navHistory.push({id:selected,state,query})}selected=id;query=q;const p=REG.find(x=>x.id===id),par=new URLSearchParams(q);state=par.get('state')||p.states[0];if(!p.states.includes(state))state=p.states[0];render()}
function closeIndex(){$('#index').classList.remove('open');lastFocus?.focus()}
$('#open-index').onclick=()=>{lastFocus=document.activeElement;$('#index').classList.add('open');$('#index-query').focus()};$('#close-index').onclick=closeIndex;$('#index').addEventListener('click',e=>{if(e.target===$('#index'))closeIndex()});$('#index-query').oninput=renderIndex;$('#screen-select').onchange=e=>navigate(e.target.value);$('#state-select').onchange=e=>{state=e.target.value;query='';render()};['width','theme'].forEach(x=>$('#'+x).onchange=render);$('#compare').onclick=()=>{compare=!compare;$('#compare').setAttribute('aria-pressed',compare);render()};$('#full-page').onclick=()=>{full=!full;$('#full-page').setAttribute('aria-pressed',full);frames.forEach(f=>{f.style.height=full?Math.min(f.contentDocument?.documentElement.scrollHeight||1000,120000)+'px':($('#width').value==='390'?844:1000)+'px'})};$('#help').onclick=()=>navigate('D03');
addEventListener('message',e=>{if(!e.data?.phongdao||!frames.some(f=>f.contentWindow===e.source))return;if(e.data.type==='navigate')navigate(e.data.id,e.data.query);if(e.data.type==='back'){const back=navHistory.pop();if(back){selected=back.id;state=back.state;query=back.query;render();frames.forEach(f=>f.addEventListener('load',()=>f.contentWindow.scrollTo(0,positions[selected+'|'+state]||0),{once:true}))}else navigate('R01')}if(e.data.type==='theme'){$('#theme').value=e.data.theme;}if(e.data.type==='height'&&full){const f=frames.find(f=>f.contentWindow===e.source);if(f)f.style.height=Math.min(e.data.height,120000)+'px'}});
document.addEventListener('keydown',e=>{if(!$('#index').classList.contains('open'))return;if(e.key==='Escape')closeIndex();if(e.key==='Tab'){const list=[...$('#index').querySelectorAll('button,input')],a=list[0],z=list.at(-1);if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}}});const h=location.hash.slice(1),hash=[h.slice(0,3),h.slice(4)];if(REG.some(p=>p.id===hash[0])){selected=hash[0];const st=REG.find(p=>p.id===selected).states;state=st.includes(hash[1])?hash[1]:st[0]}render();
</script></body></html>
