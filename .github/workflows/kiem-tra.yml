name: Kiểm tra repo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js (theo .node-version, cùng bản Cloudflare dùng để build)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # Dữ liệu + fixture + nhất quán + astro check + build + kiểm liên kết (docs/23 mục 1)
      - name: Chạy cổng kiểm tra
        run: npm run kiem-tra
