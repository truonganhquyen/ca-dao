name: Kiểm tra repo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js (theo .node-version, cùng bản Cloudflare dùng để build)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # Dữ liệu + fixture + nhất quán + astro check + build + kiểm liên kết (docs/23 mục 1)
      - name: Chạy cổng kiểm tra
        run: npm run kiem-tra

  # Plugin WordPress (D-056, docs/24 mục 6): chạy trong WordPress Playground, cần Node ≥ 24.18
  wordpress:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js (theo .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Kiểm thử plugin WordPress
        run: node scripts/test-wordpress.mjs

      - name: Cài gói (axe-core, puppeteer-core cho bước quét)
        run: npm ci

      - name: Quét trợ năng giao diện WordPress (WCAG 2.2 AA)
        run: node scripts/quet-trang-wordpress.mjs
